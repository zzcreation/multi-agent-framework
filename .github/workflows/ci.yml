name: CI Quality Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8 mypy types-redis
        env:
          POSTGRES_PASSWORD: test
          
      - name: Lint with flake8
        run: |
          flake8 services/ --max-line-length=120 --ignore=E501,W503
          
      - name: Type check with mypy
        run: |
          mypy services/ --ignore-missing-imports --no-error-summary
          
      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --cov=services --cov-report=xml
          
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: true
          threshold: 70%
          
  integration-tests:
    runs-on: ubuntu-latest
    needs: quality-gates
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: openclaw_test
        ports:
          - 5432:5432
          
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest psycopg2-binary
          
      - name: Run integration tests
        run: |
          pytest tests/integration/ -v
          
  security-scan:
    runs-on: ubuntu-latest
    needs: quality-gates
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run security scan
        run: |
          pip install bandit
          bandit -r services/ -f json -o bandit-report.json
          
      - name: Check for vulnerabilities
        run: |
          pip install safety
          safety check --json > safety-report.json || true
          
  build-check:
    runs-on: ubuntu-latest
    needs: [quality-gates, integration-tests, security-scan]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Verify build
        run: |
          python -m py_compile services/**/*.py
          python -c "from services.control_plane import ControlPlane; print('Build OK')"
          
  notify:
    runs-on: ubuntu-latest
    needs: build-check
    if: always()
    
    steps:
      - name: CI Summary
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "- Quality Gates: ${{ needs.quality-gates.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Integration Tests: ${{ needs.integration-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security Scan: ${{ needs.security-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build Check: ${{ needs.build-check.result }}" >> $GITHUB_STEP_SUMMARY