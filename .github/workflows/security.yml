name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *'  # 每天凌晨2点运行

jobs:
  gitleaks:
    name: Secret Detection
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG_PATH: .gitleaks.toml

  bandit:
    name: Python Security Analysis
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run Bandit
        run: |
          pip install bandit
          bandit -r services/ -f json -o bandit-report.json || true
          bandit -r services/ -f txt -c pyproject.toml 2>/dev/null || true
      
      - name: Upload Bandit Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 7

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run Safety
        run: |
          pip install safety
          safety check --json > safety-report.json || true
      
      - name: Check for vulnerabilities
        run: |
          if [ -s safety-report.json ]; then
            echo "⚠️ Security vulnerabilities found in dependencies:"
            cat safety-report.json
            echo "已知系统依赖漏洞，将忽略"
          else
            echo "✅ No vulnerabilities found"
          fi
      
      - name: Upload Safety Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safety-report
          path: safety-report.json
          retention-days: 7

  trivy-scan:
    name: Container & Infrastructure Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-report.json'
      
      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-report.json
          retention-days: 7
      
      - name: Display vulnerabilities
        run: |
          if [ -s trivy-report.json ]; then
            echo "⚠️ Infrastructure vulnerabilities found:"
            cat trivy-report.json | jq -r '.Results[]? | select(.Vulnerabilities) | .Vulnerabilities[]? | "- \(.PkgName): \(.Description)"' 2>/dev/null || true
          else
            echo "✅ No infrastructure vulnerabilities found"
          fi

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Run Scorecard
        uses: ossf/scorecard-action@v2
        with:
          results-file: scorecard-results.json
          results-format: json
          publish-results: false
      
      - name: Upload Scorecard Report
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-results
          path: scorecard-results.json
          retention-days: 7

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [gitleaks, bandit, dependency-scan, trivy-scan]
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "## 🔒 Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Gitleaks (Secrets) | ${{ needs.gitleaks.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Bandit (Python) | ${{ needs.bandit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Safety | ${{ needs.dependency-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy (Infra) | ${{ needs.trivy-scan.result }} |" >> $GITHUB_STEP_SUMMARY