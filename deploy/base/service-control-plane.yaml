apiVersion: v1
kind: Service
metadata:
  name: openclaw-control-plane
  namespace: openclaw-system
  labels:
    component: control-plane
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    component: control-plane
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw-worker
  namespace: openclaw-system
  labels:
    component: worker
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 9090
    protocol: TCP
    name: metrics
  selector:
    component: worker