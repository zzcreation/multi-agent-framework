apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: openclaw-system
data:
  LOG_LEVEL: "info"
  REDIS_URL: "redis://redis:6379"
  DATABASE_URL: "postgresql://postgres:5432/openclaw"
  METRICS_PORT: "9090"
  API_PORT: "8080"
  WORKER_CONCURRENCY: "3"
  TASK_TIMEOUT_SECONDS: "300"
  HEALTH_CHECK_INTERVAL_SECONDS: "30"