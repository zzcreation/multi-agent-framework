apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namePrefix: dev-

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: openclaw-control-plane
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: openclaw-worker

commonLabels:
  environment: dev

configMapGenerator:
  - name: openclaw-config
    behavior: replace
    literals:
      - LOG_LEVEL=debug
      - ENVIRONMENT=development