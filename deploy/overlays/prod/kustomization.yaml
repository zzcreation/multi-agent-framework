apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namePrefix: prod-

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: openclaw-control-plane
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 5
    target:
      kind: Deployment
      name: openclaw-worker
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
    target:
      kind: Deployment

commonLabels:
  environment: production

configMapGenerator:
  - name: openclaw-config
    behavior: replace
    literals:
      - LOG_LEVEL=info
      - ENVIRONMENT=production

images:
  - name: openclaw/control-plane
    newTag: v0.2.0
  - name: openclaw/worker
    newTag: v0.2.0