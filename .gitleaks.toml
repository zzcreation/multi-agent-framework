# Gitleaks Configuration
# https://github.com/zricethezav/gitleaks

[allowlist]
description = "Allowlisted files and patterns"
paths = [
    "*.md",
    "*.txt",
    "*.json",
    ".git/**",
    "**/test/**",
    "**/tests/**",
    "**/__pycache__/**",
    "**/*.pyc",
    "docs/**",
    "examples/**",
]

[allowlist]
description = "Allowlisted patterns for testing"
regexes = [
    "fake[_-]?api[_-]?key",
    "test[_-]?key",
    "dummy[_-]?token",
    "your[_-]?key[_-]?here",
    "xxxxx*",
    "-----BEGIN.*-----",
]

[[rules]]
description = "AWS Access Key ID"
regex = '''(A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}'''
tags = ["key", "AWS"]

[[rules]]
description = "AWS Secret Access Key"
regex = '''(?i)aws(.{0,20})?(?-i)secret(.{0,20})?['\"][0-9a-zA-Z/+]{40}['\"]'''
tags = ["key", "AWS"]

[[rules]]
description = "GitHub Personal Access Token"
regex = '''ghp_[0-9a-zA-Z]{36}'''
tags = ["key", "GitHub"]

[[rules]]
description = "GitHub OAuth Access Token"
regex = '''gho_[0-9a-zA-Z]{36}'''
tags = ["key", "GitHub"]

[[rules]]
description = "GitLab Personal Access Token"
regex = '''glpat-[0-9a-zA-Z\-]{20}'''
tags = ["key", "GitLab"]

[[rules]]
description = "Slack Token"
regex = '''xox[baprs]-[0-9]{10,13}-[0-9]{10,13}[a-zA-Z0-9-]*'''
tags = ["key", "Slack"]

[[rules]]
description = "Stripe API Key"
regex = '''sk_live_[0-9a-zA-Z]{24}'''
tags = ["key", "Stripe"]

[[rules]]
description = "OpenAI API Key"
regex = '''sk-[0-9a-zA-Z]{48,}'''
tags = ["key", "OpenAI"]

[[rules]]
description = "JWT Token"
regex = '''eyJ[A-Za-z0-9-_=]+\.eyJ[A-Za-z0-9-_=]+\.[A-Za-z0-9-_.+/=]*'''
tags = ["key", "JWT"]

[[rules]]
description = "Generic API Key"
regex = '''(?i)(api[_-]?key|apikey|access[_-]?token|auth[_-]?token)['"]?\s*[:=]\s*['"][0-9a-zA-Z]{16,}['"]'''
tags = ["key", "generic"]

[[rules]]
description = "Private Key"
regex = '''-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'''
tags = ["key", "private"]

[[rules]]
description = "Database Connection String"
regex = '''(?i)(mongodb|postgres|mysql|redis)://[^\s'"]+'''
tags = ["connection", "database"]

[[rules]]
description = "Environment Variable Assignment"
regex = '''(?i)(password|passwd|pwd|secret|token|key)\s*=\s*['"][^'"]+['"]'''
tags = ["env", "secret"]
[allowlist]
description = "Allowlist database connection patterns"
regexes = [
    "postgresql://.*:.*@",
    "os\\.getenv\\(",
    "os\\.environ\\.get\\(",
]
